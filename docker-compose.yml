name: othelio-prod

# OpenShip production stack. DATABASE_URL is bound to the separate PostgreSQL app.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Bind the PostgreSQL app connection in OpenShip}
      AUTH_SECRET: ${AUTH_SECRET:?Set a production auth secret in OpenShip}
      NODE_ENV: production
      CHAIN_ID: "8453"
      BASE_RPC_URL: ${BASE_RPC_URL:?Set a Base mainnet RPC URL in OpenShip}
      API_PORT: "3001"
      ENABLE_MOCK_DEX_SWAPS: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    command: [ "sh", "-c", "node backend/scripts/migrate.cjs && exec node backend/dist/main.js" ]
    ports:
      - "3001:3001"
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    restart: unless-stopped

  indexer:
    build:
      context: ./indexer
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Bind the PostgreSQL app connection in OpenShip}
      RPC_URL: ${BASE_RPC_URL:?Set a Base mainnet RPC URL in OpenShip}
      RPC_URL_SECONDARY: ${RPC_URL_SECONDARY:-}
      CHAIN_ID: "8453"
      START_BLOCK: "52046045"
      INDEXER_CONFIRMATIONS: "1"
      BATCH_SIZE: "9"
      INDEXER_CATCHUP_CONCURRENCY: "1"
      INDEXER_CATCHUP_MIN_INTERVAL_MS: "6000"
      INDEXER_HEAD_POLL_INTERVAL_SECS: "5"
      INDEXER_PRICE_INTERVAL_BLOCKS: "10"
      FACTORY_ADDRESS: "0xAd21D1aACF2B3c84608e69eAa87B798d27A3915D"
      MODULE_ADDRESS: "0x245836a679b69e16617e2055d8d809EA5858c81C"
      ASSET_REGISTRY_ADDRESS: "0x3DB84b8e172A2b8b1634F8C630C6e2acD07424AC"
      RISK_SPLIT_FACTORY_ADDRESS: ${RISK_SPLIT_FACTORY_ADDRESS:-}
      RISK_SPLIT_INDEXING_ENABLED: ${RISK_SPLIT_INDEXING_ENABLED:-true}
      UPSIDE_FACTORY_ADDRESS: ${UPSIDE_FACTORY_ADDRESS:-}
      VALUATION_INTERVAL_SECS: "3600"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
