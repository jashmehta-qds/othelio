services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: othelio
      POSTGRES_PASSWORD: othelio
      POSTGRES_DB: othelio
    ports: ["5433:5432"]
    volumes:
      - othelio-postgres:/var/lib/postgresql/data
      - ./database/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U othelio"]
      interval: 3s
      timeout: 3s
      retries: 10

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: anvil --host 0.0.0.0 --port 8545 --fork-url https://mainnet.base.org --fork-block-number 51166844 --chain-id 31337
    ports: ["8545:8545"]
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://127.0.0.1:8545 >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 15

  contracts-deployer:
    image: ghcr.io/foundry-rs/foundry:latest
    working_dir: /workspace/contracts
    volumes:
      - .:/workspace
    tmpfs:
      # Keep Foundry's broadcast output out of the host checkout.
      - /workspace/contracts/broadcast:rw,mode=0777,uid=1000,gid=1000
    environment:
      # This registry has no code at the pinned Base fork block.
      COINBASE_REGISTRY_ADDRESS: "0x0000000000000000000000000000000000000000"
    entrypoint:
      - sh
      - -c
      - >-
        if [ "$$(cast code 0x742b49cF43083584cb53467b119146Ef361b571f --rpc-url http://anvil:8545)" != "0x" ]; then
          echo "Othelio contracts already deployed; skipping deployment";
          exit 0;
        fi;
        exec forge script script/DeployOthelio.s.sol --tc DeployOthelio --rpc-url http://anvil:8545 --broadcast
    depends_on:
      anvil: { condition: service_healthy }

  indexer:
    build:
      context: ./indexer
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://othelio:othelio@postgres:5432/othelio
      RPC_URL: http://anvil:8545
      CHAIN_ID: "31337"
      FACTORY_ADDRESS: "0x742b49cF43083584cb53467b119146Ef361b571f"
      MODULE_ADDRESS: "0x835E426B749C7a215CeD0E487981271Cbf399c05"
    depends_on:
      postgres: { condition: service_healthy }
      contracts-deployer: { condition: service_completed_successfully }

volumes:
  othelio-postgres:
