services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: othelio
      POSTGRES_PASSWORD: othelio
      POSTGRES_DB: othelio
    ports: ["5433:5432"]
    volumes:
      - othelio-postgres:/var/lib/postgresql/data
      - ./database/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U othelio"]
      interval: 3s
      timeout: 3s
      retries: 10

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: anvil --host 0.0.0.0 --port 8545 --fork-url https://mainnet.base.org --chain-id 31337
    ports: ["8545:8545"]

  contracts-deployer:
    image: ghcr.io/foundry-rs/foundry:latest
    working_dir: /workspace/contracts
    volumes: [".:/workspace"]
    environment:
      COINBASE_REGISTRY_ADDRESS: "0x3f3E8cf41cdd3b1D118c16471aB0113DfDDd5CaD"
    entrypoint: >
      sh -c "sleep 2 && forge script script/DeployOthelio.s.sol --rpc-url http://anvil:8545 --broadcast"
    depends_on:
      - anvil

  indexer:
    build:
      context: ./indexer
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://othelio:othelio@postgres:5432/othelio
      RPC_URL: http://anvil:8545
      CHAIN_ID: "31337"
      FACTORY_ADDRESS: "0x3265d5204f6967C7AF1Fd74ca229D80Bba7ea47F"
      MODULE_ADDRESS: "0x6C74A834F48f2f336ff367f3DC517D97C873D4CC"
    depends_on:
      postgres: { condition: service_healthy }
      contracts-deployer: { condition: service_completed_successfully }

volumes:
  othelio-postgres:
