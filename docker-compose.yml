services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: othelio
      POSTGRES_PASSWORD: othelio
      POSTGRES_DB: othelio
    ports: ["5432:5432"]
    volumes:
      - othelio-postgres:/var/lib/postgresql/data
      - ./database/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U othelio"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: node:22-alpine
    working_dir: /workspace
    command: npm run dev:backend
    env_file: .env
    volumes: [".:/workspace"]
    ports: ["3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }

  indexer:
    build:
      context: ./indexer
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  othelio-postgres:
